# ─────────────────────────────────────────────────────────────────────────────
#  Tip-Center · Nginx site config
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root  /var/www/html/public;
    index index.php index.html;

    # Logs
    access_log /var/log/nginx/tip-access.log;
    error_log  /var/log/nginx/tip-error.log;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"  always;
    add_header X-Content-Type-Options    "nosniff"     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Health-check endpoint (used by Docker healthcheck)
    location = /up {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Static assets – long cache, no PHP processing
    location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|webp)$ {
        expires     1y;
        access_log  off;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # Main Laravel router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP via PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass  app:9000;
        fastcgi_index index.php;
        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO        $fastcgi_path_info;
        fastcgi_param HTTP_HOST        $host;
        fastcgi_read_timeout 120;
    }

    # Block access to dot-files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
