[www]
user = www-data
group = www-data
listen = 9000
listen.allowed_clients = 127.0.0.1

; Process manager
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Status and ping for monitoring
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Timeouts
request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/slow.log

clear_env = no
