; ─────────────────────────────────────────────────────────────────────────────
;  Tip-Center · PHP configuration
; ─────────────────────────────────────────────────────────────────────────────

; Uploads
upload_max_filesize = 256M
post_max_size       = 256M
max_file_uploads    = 20

; Memory & execution
memory_limit        = 256M
max_execution_time  = 120
max_input_time      = 120

; Timezone
date.timezone       = Asia/Riyadh

; Error reporting (override in production via APP_DEBUG)
expose_php          = Off

; OPcache – dramatically speeds up PHP in production
[opcache]
opcache.enable                 = 1
opcache.enable_cli             = 0
opcache.memory_consumption     = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 10000
opcache.revalidate_freq        = 60
opcache.save_comments          = 1
opcache.fast_shutdown          = 1
